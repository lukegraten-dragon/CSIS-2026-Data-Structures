name: Date-Based Tagging

# This is the only AI generated code (Generated by Gemini) in the GitHub repository
# The C++ source files are written by me manually. This action is just
# a small QOL thing I want to add.

on:
  push:
    branches:
      - main

jobs:
  tag-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch existing tags from the repository

      - name: Create and Push Date Tag
        run: |
          # Fetch all remote tags to ensure accurate collision checks
          git fetch --tags

          DATE_PREFIX=$(date +'%Y%m%d')
          COUNTER=0

          while true; do
            # Format the counter as a two-digit number (CC), e.g., 00, 01, 02
            TAG_NAME="${DATE_PREFIX}$(printf "%02d" $COUNTER)"
            
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              COUNTER=$((COUNTER + 1))
            else
              break
            fi
          done

          echo "Creating tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG_NAME" -m "Automated date tag: $TAG_NAME"
          git push origin "$TAG_NAME"